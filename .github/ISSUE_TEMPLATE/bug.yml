name: Bug
description: Reportar un error reproducible
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        No adjuntes expedientes reales, nombres, números de causa ni datos de
        clientes. Para reproducir el problema, usá un PDF sintético o describí
        su estructura.

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: ¿Qué pasó y qué esperabas que pasara?
      placeholder: La detección por texto devuelve un solo trámite...
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Incluí el comando exacto y la salida.
      placeholder: |
        1. Ejecuté ...
        2. Con el PDF ...
        3. Obtuve ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión
      description: Salida de `separador-expedientes --version`.
      placeholder: 2.0.0
    validations:
      required: true

  - type: input
    id: entorno
    attributes:
      label: Entorno
      description: Sistema operativo, versión de Python y backend.
      placeholder: Windows 11, Python 3.12, pypdf 5.x
    validations:
      required: true

  - type: dropdown
    id: pdf
    attributes:
      label: Tipo de PDF
      options:
        - Con bookmarks
        - Sin bookmarks, con texto
        - Escaneado, sin texto
        - Con mapa manual
        - No estoy seguro
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Salida o traceback
      description: Pegá el error completo, sin datos reales.
      render: text

  - type: checkboxes
    id: datos
    attributes:
      label: Datos
      options:
        - label: Confirmo que no incluí expedientes ni datos reales.
          required: true
        - label: Revisé que el problema no esté en las preguntas frecuentes.
          required: true
