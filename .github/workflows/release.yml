name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Construir sdist y wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar build
        run: python -m pip install build
      - name: Construir
        run: python -m build
      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    name: Publicar en PyPI
    needs: build
    if: "!github.event.release.prerelease"
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/separador-expedientes/
    permissions:
      id-token: write
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publicar con Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Adjuntar artefactos al release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Subir archivos
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
